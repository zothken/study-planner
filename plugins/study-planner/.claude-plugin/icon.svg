<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Study Planner</title>
  <rect width="512" height="512" rx="112" fill="#2F3A8F"/>
  <!-- calendar sheet -->
  <rect x="104" y="128" width="304" height="280" rx="32" fill="#FFFFFF"/>
  <path d="M136 128h240a32 32 0 0 1 32 32v40H104v-40a32 32 0 0 1 32-32z" fill="#F2B84B"/>
  <!-- binder rings -->
  <rect x="164" y="100" width="24" height="60" rx="12" fill="#FFFFFF" stroke="#2F3A8F" stroke-width="8"/>
  <rect x="324" y="100" width="24" height="60" rx="12" fill="#FFFFFF" stroke="#2F3A8F" stroke-width="8"/>
  <!-- timetable grid -->
  <g fill="#DDE1F5">
    <rect x="136" y="228" width="68" height="44" rx="10"/>
    <rect x="222" y="228" width="68" height="44" rx="10"/>
    <rect x="136" y="290" width="68" height="44" rx="10"/>
    <rect x="308" y="290" width="68" height="44" rx="10"/>
    <rect x="136" y="352" width="68" height="28" rx="10"/>
    <rect x="222" y="352" width="68" height="28" rx="10"/>
    <rect x="308" y="352" width="68" height="28" rx="10"/>
  </g>
  <rect x="308" y="228" width="68" height="44" rx="10" fill="#2F3A8F"/>
  <rect x="222" y="290" width="68" height="44" rx="10" fill="#2F3A8F"/>
  <!-- check -->
  <path d="M240 312l14 12 22-26" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
